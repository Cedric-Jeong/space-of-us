<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우리의 공간</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  // ⚠️ 여기에 본인의 Firebase 설정을 입력하세요
  const firebaseConfig = {
    apiKey: "AIzaSyDYI-iCYs9iMc2CLgWbhPsbbIAvjaAARFE",
    authDomain: "space-of-us.firebaseapp.com",
    databaseURL: "https://space-of-us-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "space-of-us",
    storageBucket: "space-of-us.firebasestorage.app",
    messagingSenderId: "555986533527",
    appId: "1:555986533527:web:a94d639bf16425f6af3dd2",
    measurementId: "G-11YGRFKJ1H"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window._fb = { auth, db, storage, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove, getDoc, setDoc, deleteDoc, ref, uploadBytes, getDownloadURL };
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --sage: #7A9E76;
  --sage-l: #C5DAC3;
  --sage-d: #4A6B47;
  --warm: #C97D52;
  --warm-l: #F0D4BC;
  --cream: #FAF8F2;
  --paper: #FFFEFB;
  --ink: #1E1E1C;
  --ink2: #5A5855;
  --ink3: #9A9895;
  --border: rgba(30,30,28,0.1);
  --r: 14px;
  --rm: 10px;
}
html, body { height: 100%; background: var(--cream); color: var(--ink); font-family: 'Gowun Dodum', sans-serif; overflow: hidden; }

/* ── AUTH SCREEN ── */
#auth-screen {
  position: fixed; inset: 0; background: var(--cream);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 24px; z-index: 100;
}
.auth-logo { font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 600; color: var(--sage-d); margin-bottom: 6px; }
.auth-sub { font-size: 13px; color: var(--ink3); margin-bottom: 40px; letter-spacing: 0.04em; }
.auth-card { background: var(--paper); border: 0.5px solid var(--border); border-radius: var(--r); padding: 24px; width: 100%; max-width: 340px; }
.auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.auth-tab { flex: 1; padding: 10px; text-align: center; font-size: 14px; color: var(--ink3); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
.auth-tab.active { color: var(--sage-d); border-bottom-color: var(--sage-d); }
.inp {
  width: 100%; padding: 12px 14px; border: 0.5px solid var(--border);
  border-radius: var(--rm); font-family: 'Gowun Dodum', sans-serif;
  font-size: 14px; background: var(--cream); color: var(--ink);
  outline: none; margin-bottom: 10px; transition: border-color .2s;
}
.inp:focus { border-color: var(--sage); }
.btn-primary {
  width: 100%; padding: 13px; background: var(--sage-d); color: white;
  border: none; border-radius: var(--rm); font-family: 'Gowun Dodum', sans-serif;
  font-size: 15px; cursor: pointer; margin-top: 4px; transition: opacity .2s;
}
.btn-primary:active { opacity: 0.8; }
.auth-err { font-size: 12px; color: #c94a4a; margin-top: 8px; text-align: center; min-height: 16px; }

/* ── APP SHELL ── */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; visibility: hidden; }
#app.ready { visibility: visible; }

/* Header */
.app-header {
  background: var(--paper); border-bottom: 0.5px solid var(--border);
  padding: 14px 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; padding-top: max(14px, env(safe-area-inset-top));
}
.app-title { font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600; color: var(--sage-d); }
.header-user { display: flex; align-items: center; gap: 8px; }
.user-av { width: 30px; height: 30px; border-radius: 50%; background: var(--sage-l); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--sage-d); }
.logout-btn { font-size: 11px; color: var(--ink3); padding: 4px 8px; border: 0.5px solid var(--border); border-radius: 20px; background: none; cursor: pointer; }

/* Tab bar */
.tab-bar {
  display: flex; background: var(--paper); border-bottom: 0.5px solid var(--border);
  flex-shrink: 0; overflow-x: auto; padding: 0 4px;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tb { flex: 1; min-width: 70px; padding: 10px 4px 8px; text-align: center; font-size: 12px; color: var(--ink3); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; font-family: 'Gowun Dodum', sans-serif; }
.tb.active { color: var(--sage-d); border-bottom-color: var(--sage-d); }
.tb-icon { font-size: 16px; display: block; margin-bottom: 2px; }

/* Scrollable content */
.content-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--cream); }
.tab-panel { display: none; padding: 16px 16px 80px; max-width: 600px; margin: 0 auto; }
.tab-panel.active { display: block; }

/* Cards */
.card { background: var(--paper); border: 0.5px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
.section-label { font-size: 11px; letter-spacing: 0.08em; color: var(--ink3); text-transform: uppercase; margin: 0 0 12px; }

/* Write box */
.write-box { background: var(--paper); border: 0.5px solid var(--border); border-radius: var(--r); padding: 14px; margin-bottom: 16px; }
.write-box textarea { width: 100%; border: none; background: none; resize: none; font-family: 'Gowun Dodum', sans-serif; font-size: 14px; color: var(--ink); outline: none; line-height: 1.75; min-height: 80px; }
.write-box textarea::placeholder { color: var(--ink3); }
.write-footer { display: flex; align-items: center; gap: 8px; margin-top: 8px; border-top: 0.5px solid var(--border); padding-top: 10px; flex-wrap: wrap; }
.tag-chip { font-size: 11px; padding: 4px 10px; border: 0.5px solid var(--border); border-radius: 20px; cursor: pointer; background: none; color: var(--ink2); font-family: 'Gowun Dodum', sans-serif; transition: all .15s; }
.tag-chip.sel { background: var(--sage-l); border-color: var(--sage); color: var(--sage-d); }
.post-btn { margin-left: auto; font-size: 13px; padding: 7px 18px; background: var(--sage-d); color: white; border: none; border-radius: 8px; font-family: 'Gowun Dodum', sans-serif; cursor: pointer; flex-shrink: 0; }
.post-btn:active { opacity: 0.8; }

/* Photo upload */
.photo-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.photo-preview { width: 72px; height: 72px; border-radius: var(--rm); object-fit: cover; border: 0.5px solid var(--border); }
.photo-add { width: 72px; height: 72px; border-radius: var(--rm); border: 1.5px dashed var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink3); font-size: 22px; flex-shrink: 0; }
#photo-input { display: none; }

/* Feed card */
.feed-card { background: var(--paper); border: 0.5px solid var(--border); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
.fc-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
.av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; flex-shrink: 0; }
.av-me { background: var(--sage-l); color: var(--sage-d); }
.av-other { background: var(--warm-l); color: var(--warm); }
.fc-name { font-size: 14px; font-weight: 500; }
.fc-time { font-size: 11px; color: var(--ink3); margin-left: auto; }
.fc-text { font-size: 14px; line-height: 1.75; color: var(--ink); padding: 0 14px 10px; }
.fc-photos { display: grid; gap: 2px; margin-bottom: 2px; }
.fc-photos.one img { width: 100%; max-height: 280px; object-fit: cover; }
.fc-photos.two { grid-template-columns: 1fr 1fr; }
.fc-photos.two img, .fc-photos.three img { width: 100%; height: 160px; object-fit: cover; }
.fc-photos.three { grid-template-columns: 1fr 1fr; }
.fc-photos.three img:first-child { grid-column: 1/-1; height: 180px; }
.fc-tag { display: inline-flex; font-size: 10px; padding: 2px 8px; border-radius: 20px; margin: 0 14px 10px; }
.tag-daily { background: var(--sage-l); color: var(--sage-d); }
.tag-thought { background: var(--warm-l); color: var(--warm); }
.tag-photo { background: #EAE0F5; color: #6B4A9E; }
.fc-actions { display: flex; border-top: 0.5px solid var(--border); }
.fc-action-btn { flex: 1; padding: 9px 4px; font-size: 12px; color: var(--ink2); background: none; border: none; font-family: 'Gowun Dodum', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: background .15s; }
.fc-action-btn:active { background: var(--cream); }
.fc-action-btn + .fc-action-btn { border-left: 0.5px solid var(--border); }
.fc-action-btn.liked { color: #e05a5a; }

/* Comments */
.fc-comments { border-top: 0.5px solid var(--border); padding: 10px 14px; }
.comment { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
.comment-body { background: var(--cream); border-radius: var(--rm); padding: 8px 10px; flex: 1; }
.comment-name { font-size: 11px; font-weight: 500; color: var(--sage-d); margin-bottom: 2px; }
.comment-text { font-size: 13px; line-height: 1.6; color: var(--ink); }
.comment-input-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.comment-input { flex: 1; padding: 8px 12px; border: 0.5px solid var(--border); border-radius: 20px; font-family: 'Gowun Dodum', sans-serif; font-size: 13px; background: var(--cream); color: var(--ink); outline: none; }
.comment-input:focus { border-color: var(--sage); }
.comment-send { width: 32px; height: 32px; border-radius: 50%; background: var(--sage-d); color: white; border: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Memory cards (편지함 → 추억/메시지 공간) */
.memory-card { background: var(--paper); border: 0.5px solid var(--border); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
.mc-header { padding: 12px 14px 8px; display: flex; align-items: center; gap: 8px; }
.mc-to { font-size: 11px; color: var(--ink3); }
.mc-to span { color: var(--warm); font-weight: 500; }
.mc-body { font-family: 'Noto Serif KR', serif; font-size: 14px; line-height: 1.9; color: var(--ink); padding: 0 14px 12px; }
.mc-photo { width: 100%; max-height: 220px; object-fit: cover; }
.mc-footer { padding: 8px 14px; border-top: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.mc-from { font-size: 11px; color: var(--ink3); }
.mc-type { font-size: 10px; padding: 2px 8px; border-radius: 20px; }
.type-msg { background: var(--warm-l); color: var(--warm); }
.type-memory { background: var(--sage-l); color: var(--sage-d); }

/* Goals */
.goal-section-title { font-size: 13px; font-weight: 500; color: var(--ink2); margin: 16px 0 8px; display: flex; align-items: center; gap: 6px; }
.goal-main-card { background: var(--paper); border: 0.5px solid var(--border); border-radius: var(--r); margin-bottom: 8px; overflow: hidden; }
.gmc-header { padding: 12px 14px 10px; cursor: pointer; display: flex; align-items: flex-start; gap: 10px; }
.gmc-av { width: 30px; height: 30px; border-radius: 50%; background: var(--sage-l); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--sage-d); flex-shrink: 0; }
.gmc-info { flex: 1; }
.gmc-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.progress-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--sage); border-radius: 3px; transition: width .4s; }
.gmc-pct { font-size: 12px; color: var(--sage-d); font-weight: 500; flex-shrink: 0; margin-top: 2px; }
.sub-goals { border-top: 0.5px solid var(--border); padding: 10px 14px; }
.sub-goal { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 0.5px solid var(--border); }
.sub-goal:last-of-type { border-bottom: none; }
.sub-check { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all .15s; }
.sub-check.done { background: var(--sage); border-color: var(--sage); color: white; }
.sub-goal-text { font-size: 13px; flex: 1; color: var(--ink2); }
.sub-goal-text.done { text-decoration: line-through; color: var(--ink3); }
.add-sub-row { display: flex; gap: 8px; margin-top: 8px; }
.add-sub-inp { flex: 1; padding: 7px 10px; border: 0.5px solid var(--border); border-radius: 8px; font-family: 'Gowun Dodum', sans-serif; font-size: 13px; background: var(--cream); color: var(--ink); outline: none; }
.add-sub-btn { padding: 7px 12px; background: var(--sage-d); color: white; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: 'Gowun Dodum', sans-serif; }

/* Cheer bubble */
.cheer-bubble { background: var(--sage-l); border-radius: var(--rm); padding: 8px 12px; margin: 0 14px 12px; font-size: 12px; color: var(--sage-d); display: flex; gap: 6px; }

/* Keyword banner */
.kw-banner { background: linear-gradient(135deg, var(--sage-l) 0%, var(--warm-l) 100%); border-radius: var(--r); padding: 14px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.kw-label { font-size: 10px; letter-spacing: 0.07em; color: var(--sage-d); margin-bottom: 4px; }
.kw-words { display: flex; gap: 8px; align-items: center; }
.kw-word { font-family: 'Noto Serif KR', serif; font-size: 18px; font-weight: 600; color: var(--sage-d); }
.kw-vs { font-size: 11px; color: var(--sage); }

/* Empty state */
.empty { text-align: center; padding: 48px 20px; color: var(--ink3); font-size: 14px; }
.empty-icon { font-size: 36px; margin-bottom: 12px; }

/* Loading */
.loading { text-align: center; padding: 32px; color: var(--ink3); font-size: 13px; }

/* Toast */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--ink); color: white; font-size: 13px; padding: 10px 20px; border-radius: 20px; z-index: 999; transition: transform .25s; pointer-events: none; white-space: nowrap; }
#toast.show { transform: translateX(-50%) translateY(0); }

/* Select mode chips */
.type-select { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.type-btn { font-size: 12px; padding: 5px 12px; border: 0.5px solid var(--border); border-radius: 20px; cursor: pointer; background: none; color: var(--ink2); font-family: 'Gowun Dodum', sans-serif; }
.type-btn.sel { background: var(--warm-l); border-color: var(--warm); color: var(--warm); }

/* Add goal form */
.add-goal-form { background: var(--paper); border: 0.5px dashed var(--sage); border-radius: var(--r); padding: 14px; margin-bottom: 12px; display: none; }
.add-goal-form.open { display: block; }
.form-label { font-size: 11px; color: var(--ink3); margin-bottom: 6px; display: block; }
.add-goal-inp { width: 100%; padding: 9px 12px; border: 0.5px solid var(--border); border-radius: var(--rm); font-family: 'Gowun Dodum', sans-serif; font-size: 14px; background: var(--cream); color: var(--ink); outline: none; margin-bottom: 10px; }
.add-goal-inp:focus { border-color: var(--sage); }
.form-actions { display: flex; gap: 8px; }
.btn-cancel { flex: 1; padding: 10px; background: none; border: 0.5px solid var(--border); border-radius: var(--rm); font-family: 'Gowun Dodum', sans-serif; font-size: 13px; color: var(--ink2); cursor: pointer; }
.btn-save { flex: 2; padding: 10px; background: var(--sage-d); color: white; border: none; border-radius: var(--rm); font-family: 'Gowun Dodum', sans-serif; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-logo">우리의 공간 ✦</div>
  <div class="auth-sub">친구와 함께하는 소중한 기록</div>
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuthTab('login')">로그인</div>
      <div class="auth-tab" onclick="switchAuthTab('signup')">회원가입</div>
    </div>
    <div id="login-form">
      <input class="inp" id="login-email" type="email" placeholder="이메일">
      <input class="inp" id="login-pw" type="password" placeholder="비밀번호">
      <button class="btn-primary" onclick="doLogin()">로그인</button>
    </div>
    <div id="signup-form" style="display:none;">
      <input class="inp" id="su-name" type="text" placeholder="닉네임 (예: 지은)">
      <input class="inp" id="su-email" type="email" placeholder="이메일">
      <input class="inp" id="su-pw" type="password" placeholder="비밀번호 (6자 이상)">
      <button class="btn-primary" onclick="doSignup()">가입하기</button>
    </div>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="app-title">우리의 공간 ✦</div>
    <div class="header-user">
      <div class="user-av" id="user-av">?</div>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tb active" onclick="showTab('feed')"><span class="tb-icon">🌿</span>피드</button>
    <button class="tb" onclick="showTab('memory')"><span class="tb-icon">💌</span>메시지</button>
    <button class="tb" onclick="showTab('goals')"><span class="tb-icon">🎯</span>목표</button>
    <button class="tb" onclick="showTab('books')"><span class="tb-icon">📚</span>독서</button>
  </div>

  <div class="content-area">

    <!-- FEED -->
    <div id="panel-feed" class="tab-panel active">
      <div class="kw-banner">
        <div>
          <div class="kw-label">이달의 키워드</div>
          <div class="kw-words">
            <span class="kw-word" id="kw1">성장</span>
            <span class="kw-vs">×</span>
            <span class="kw-word" id="kw2">여유</span>
          </div>
        </div>
        <button class="tag-chip" onclick="editKeywords()" style="font-size:11px;">수정</button>
      </div>

      <div class="write-box">
        <textarea id="feed-text" placeholder="오늘 어떤 하루였어? ✍️"></textarea>
        <div class="photo-row" id="feed-photo-row">
          <label for="photo-input" class="photo-add">+</label>
        </div>
        <input type="file" id="photo-input" accept="image/*" multiple onchange="handlePhotos(this)">
        <div class="write-footer">
          <button class="tag-chip sel" onclick="selTag(this,'daily')">일상</button>
          <button class="tag-chip" onclick="selTag(this,'thought')">생각</button>
          <button class="tag-chip" onclick="selTag(this,'photo')">사진</button>
          <button class="post-btn" onclick="postFeed()">올리기</button>
        </div>
      </div>

      <div class="section-label">최근 기록</div>
      <div id="feed-list"><div class="loading">불러오는 중...</div></div>
    </div>

    <!-- MEMORY (메시지/추억) -->
    <div id="panel-memory" class="tab-panel">
      <div class="write-box">
        <div style="margin-bottom:8px;">
          <div style="font-size:12px;color:var(--ink3);margin-bottom:6px;">유형 선택</div>
          <div class="type-select">
            <button class="type-btn sel" onclick="selMemType(this,'msg')">💬 하고싶은 말</button>
            <button class="type-btn" onclick="selMemType(this,'memory')">📸 추억 공유</button>
            <button class="type-btn" onclick="selMemType(this,'advice')">💡 조언</button>
            <button class="type-btn" onclick="selMemType(this,'cheer')">🌟 응원</button>
          </div>
        </div>
        <textarea id="mem-text" placeholder="친구에게 남기고 싶은 말을 써봐 ✉️" style="min-height:90px;"></textarea>
        <div class="photo-row" id="mem-photo-row">
          <label for="mem-photo-input" class="photo-add">+</label>
        </div>
        <input type="file" id="mem-photo-input" accept="image/*" onchange="handleMemPhoto(this)">
        <div class="write-footer">
          <span style="font-size:12px;color:var(--ink3);">To.</span>
          <input id="mem-to" class="tag-chip" placeholder="받는 사람 닉네임" style="width:110px;border-radius:20px;outline:none;font-size:11px;">
          <button class="post-btn" onclick="postMemory()">남기기</button>
        </div>
      </div>

      <div class="section-label">메시지 & 추억</div>
      <div id="memory-list"><div class="loading">불러오는 중...</div></div>
    </div>

    <!-- GOALS -->
    <div id="panel-goals" class="tab-panel">
      <button class="post-btn" style="width:100%;margin-bottom:16px;" onclick="toggleGoalForm()">+ 목표 추가하기</button>
      <div class="add-goal-form" id="goal-form">
        <label class="form-label">목표 이름</label>
        <input class="add-goal-inp" id="goal-title-inp" placeholder="예: 매일 30분 독서하기">
        <label class="form-label">첫 번째 작은 목표 (선택)</label>
        <input class="add-goal-inp" id="goal-sub-inp" placeholder="예: 책 1권 선정하기">
        <div class="form-actions">
          <button class="btn-cancel" onclick="toggleGoalForm()">취소</button>
          <button class="btn-save" onclick="addGoal()">저장</button>
        </div>
      </div>

      <div class="goal-section-title">🌱 나의 목표</div>
      <div id="my-goals"><div class="loading">불러오는 중...</div></div>
      <div class="goal-section-title">🎉 친구의 목표</div>
      <div id="friend-goals"><div class="loading">불러오는 중...</div></div>
    </div>

    <!-- BOOKS -->
    <div id="panel-books" class="tab-panel">
      <div class="write-box">
        <textarea id="book-review" placeholder="어떤 책을 읽었어? 제목, 저자, 소감을 남겨봐 📖" style="min-height:90px;"></textarea>
        <div class="write-footer">
          <button class="tag-chip sel" onclick="selBookStatus(this,'done')">완독</button>
          <button class="tag-chip" onclick="selBookStatus(this,'reading')">읽는중</button>
          <button class="tag-chip" onclick="selBookStatus(this,'want')">읽고싶어</button>
          <button class="post-btn" onclick="postBook()">기록</button>
        </div>
      </div>
      <div class="section-label">우리의 책장</div>
      <div id="book-list"><div class="loading">불러오는 중...</div></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script type="module">
const fb = () => window._fb;
let currentUser = null;
let selectedTag = 'daily';
let selectedMemType = 'msg';
let selectedBookStatus = 'done';
let feedPhotos = [];
let memPhoto = null;

// ── AUTH ──────────────────────────────────────────
window.switchAuthTab = (tab) => {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='signup')));
  document.getElementById('login-form').style.display = tab==='login' ? '' : 'none';
  document.getElementById('signup-form').style.display = tab==='signup' ? '' : 'none';
};

window.doLogin = async () => {
  const { auth, signInWithEmailAndPassword } = fb();
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  const err = document.getElementById('auth-err');
  try {
    err.textContent = '';
    await signInWithEmailAndPassword(auth, email, pw);
  } catch(e) {
    err.textContent = '이메일 또는 비밀번호를 확인해주세요';
  }
};

window.doSignup = async () => {
  const { auth, db, createUserWithEmailAndPassword, updateProfile, setDoc, doc } = fb();
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const pw = document.getElementById('su-pw').value;
  const err = document.getElementById('auth-err');
  if (!name) { err.textContent = '닉네임을 입력해주세요'; return; }
  try {
    err.textContent = '';
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, 'users', cred.user.uid), { name, email, createdAt: new Date() });
  } catch(e) {
    err.textContent = e.code === 'auth/email-already-in-use' ? '이미 사용 중인 이메일이에요' : '가입 중 오류가 발생했어요';
  }
};

window.doLogout = async () => {
  await fb().auth.signOut();
  document.getElementById('app').classList.remove('ready');
  document.getElementById('auth-screen').style.display = 'flex';
};

fb().onAuthStateChanged(fb().auth, async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').classList.add('ready');
    document.getElementById('user-av').textContent = (user.displayName || user.email)[0].toUpperCase();
    loadFeed(); loadMemory(); loadGoals(); loadBooks();
  } else {
    currentUser = null;
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app').classList.remove('ready');
  }
});

// ── TABS ──────────────────────────────────────────
window.showTab = (name) => {
  document.querySelectorAll('.tb').forEach((b,i) => b.classList.toggle('active', ['feed','memory','goals','books'][i]===name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
};

// ── HELPERS ──────────────────────────────────────
window.selTag = (btn, tag) => {
  document.querySelectorAll('#panel-feed .write-footer .tag-chip').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel'); selectedTag = tag;
};
window.selMemType = (btn, t) => {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel'); selectedMemType = t;
};
window.selBookStatus = (btn, s) => {
  document.querySelectorAll('#panel-books .write-footer .tag-chip').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel'); selectedBookStatus = s;
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function timeAgo(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return '방금';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
  return Math.floor(diff/86400) + '일 전';
}

async function uploadPhoto(file, path) {
  const { storage, ref, uploadBytes, getDownloadURL } = fb();
  const r = ref(storage, path);
  const snap = await uploadBytes(r, file);
  return getDownloadURL(snap.ref);
}

// ── PHOTOS ──────────────────────────────────────
window.handlePhotos = (input) => {
  feedPhotos = Array.from(input.files).slice(0,3);
  const row = document.getElementById('feed-photo-row');
  row.innerHTML = '<label for="photo-input" class="photo-add">+</label>';
  feedPhotos.forEach(f => {
    const img = document.createElement('img');
    img.className = 'photo-preview';
    img.src = URL.createObjectURL(f);
    row.insertBefore(img, row.lastChild);
  });
};

window.handleMemPhoto = (input) => {
  memPhoto = input.files[0] || null;
  const row = document.getElementById('mem-photo-row');
  row.innerHTML = '<label for="mem-photo-input" class="photo-add">+</label>';
  if (memPhoto) {
    const img = document.createElement('img');
    img.className = 'photo-preview';
    img.src = URL.createObjectURL(memPhoto);
    row.insertBefore(img, row.lastChild);
  }
};

// ── FEED ─────────────────────────────────────────
window.postFeed = async () => {
  if (!currentUser) return;
  const { db, storage, collection, addDoc, serverTimestamp } = fb();
  const text = document.getElementById('feed-text').value.trim();
  if (!text && feedPhotos.length === 0) { showToast('내용을 입력해주세요'); return; }
  const btn = document.querySelector('#panel-feed .post-btn');
  btn.textContent = '올리는 중...'; btn.disabled = true;
  try {
    const photoUrls = [];
    for (const f of feedPhotos) {
      const url = await uploadPhoto(f, `feeds/${currentUser.uid}/${Date.now()}_${f.name}`);
      photoUrls.push(url);
    }
    await addDoc(collection(db, 'feeds'), {
      text, photos: photoUrls, tag: selectedTag,
      authorId: currentUser.uid, authorName: currentUser.displayName || currentUser.email,
      createdAt: serverTimestamp(), likes: [], comments: []
    });
    document.getElementById('feed-text').value = '';
    feedPhotos = [];
    document.getElementById('feed-photo-row').innerHTML = '<label for="photo-input" class="photo-add">+</label>';
    document.getElementById('photo-input').value = '';
    showToast('✅ 피드에 올렸어!');
    loadFeed();
  } catch(e) { showToast('오류가 발생했어요'); }
  btn.textContent = '올리기'; btn.disabled = false;
};

async function loadFeed() {
  const { db, collection, getDocs, query, orderBy } = fb();
  const el = document.getElementById('feed-list');
  try {
    const snap = await getDocs(query(collection(db, 'feeds'), orderBy('createdAt','desc')));
    if (snap.empty) { el.innerHTML = '<div class="empty"><div class="empty-icon">🌿</div>첫 번째 기록을 남겨봐!</div>'; return; }
    el.innerHTML = '';
    snap.forEach(d => el.appendChild(buildFeedCard(d.id, d.data())));
  } catch(e) { el.innerHTML = '<div class="empty">불러오기 실패</div>'; }
}

function buildFeedCard(id, data) {
  const isMe = data.authorId === currentUser?.uid;
  const liked = (data.likes||[]).includes(currentUser?.uid);
  const tagClass = {daily:'tag-daily',thought:'tag-thought',photo:'tag-photo'}[data.tag] || 'tag-daily';
  const tagLabel = {daily:'일상',thought:'생각',photo:'사진'}[data.tag] || data.tag;

  const div = document.createElement('div');
  div.className = 'feed-card'; div.dataset.id = id;

  const photosHtml = (data.photos||[]).length > 0 ? (() => {
    const cnt = data.photos.length;
    const cls = ['','one','two','three'][Math.min(cnt,3)];
    return `<div class="fc-photos ${cls}">${data.photos.slice(0,3).map(u=>`<img src="${u}" loading="lazy">`).join('')}</div>`;
  })() : '';

  const commentsHtml = (data.comments||[]).map(c => `
    <div class="comment">
      <div class="av ${c.authorId===currentUser?.uid?'av-me':'av-other'}" style="width:26px;height:26px;font-size:10px;">${(c.authorName||'?')[0]}</div>
      <div class="comment-body">
        <div class="comment-name">${c.authorName||'?'}</div>
        <div class="comment-text">${c.text}</div>
      </div>
    </div>`).join('');

  div.innerHTML = `
    <div class="fc-header">
      <div class="av ${isMe?'av-me':'av-other'}">${(data.authorName||'?')[0].toUpperCase()}</div>
      <span class="fc-name">${data.authorName||'?'}</span>
      <span class="fc-time">${timeAgo(data.createdAt)}</span>
    </div>
    ${photosHtml}
    ${data.text ? `<div class="fc-text">${data.text}</div>` : ''}
    <span class="fc-tag ${tagClass}">${tagLabel}</span>
    <div class="fc-actions">
      <button class="fc-action-btn ${liked?'liked':''}" onclick="toggleLike('${id}',this)">
        ${liked?'❤️':'🤍'} ${(data.likes||[]).length > 0 ? (data.likes||[]).length : '좋아'}
      </button>
      <button class="fc-action-btn" onclick="toggleComments(this)">💬 댓글 ${(data.comments||[]).length > 0 ? (data.comments||[]).length : ''}</button>
    </div>
    <div class="fc-comments" style="display:none;">
      <div class="comments-list">${commentsHtml}</div>
      <div class="comment-input-row">
        <input class="comment-input" placeholder="댓글 남기기..." onkeydown="if(event.key==='Enter')postComment('${id}',this)">
        <button class="comment-send" onclick="postComment('${id}',this.previousElementSibling)">↑</button>
      </div>
    </div>`;
  return div;
}

window.toggleLike = async (id, btn) => {
  if (!currentUser) return;
  const { db, doc, updateDoc, arrayUnion, arrayRemove, getDoc } = fb();
  const ref = doc(db, 'feeds', id);
  const snap = await getDoc(ref);
  const likes = snap.data().likes || [];
  const alreadyLiked = likes.includes(currentUser.uid);
  await updateDoc(ref, { likes: alreadyLiked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
  const newLikes = alreadyLiked ? likes.filter(x=>x!==currentUser.uid) : [...likes, currentUser.uid];
  btn.className = `fc-action-btn ${!alreadyLiked?'liked':''}`;
  btn.innerHTML = `${!alreadyLiked?'❤️':'🤍'} ${newLikes.length > 0 ? newLikes.length : '좋아'}`;
};

window.toggleComments = (btn) => {
  const card = btn.closest('.feed-card');
  const section = card.querySelector('.fc-comments');
  const open = section.style.display !== 'none';
  section.style.display = open ? 'none' : 'block';
  if (!open) card.querySelector('.comment-input').focus();
};

window.postComment = async (id, inp) => {
  const text = inp.value.trim();
  if (!text || !currentUser) return;
  const { db, doc, updateDoc, arrayUnion } = fb();
  await updateDoc(doc(db, 'feeds', id), {
    comments: arrayUnion({ text, authorId: currentUser.uid, authorName: currentUser.displayName||currentUser.email, createdAt: new Date().toISOString() })
  });
  inp.value = '';
  const card = document.querySelector(`.feed-card[data-id="${id}"]`);
  const list = card.querySelector('.comments-list');
  const div = document.createElement('div');
  div.className = 'comment';
  div.innerHTML = `<div class="av av-me" style="width:26px;height:26px;font-size:10px;">${currentUser.displayName?.[0]?.toUpperCase()||'나'}</div><div class="comment-body"><div class="comment-name">${currentUser.displayName||currentUser.email}</div><div class="comment-text">${text}</div></div>`;
  list.appendChild(div);
  showToast('💬 댓글 달았어!');
};

// ── MEMORY ───────────────────────────────────────
window.postMemory = async () => {
  if (!currentUser) return;
  const { db, collection, addDoc, serverTimestamp } = fb();
  const text = document.getElementById('mem-text').value.trim();
  const toName = document.getElementById('mem-to').value.trim();
  if (!text && !memPhoto) { showToast('내용을 입력해주세요'); return; }
  const btn = document.querySelector('#panel-memory .post-btn');
  btn.textContent = '저장 중...'; btn.disabled = true;
  try {
    let photoUrl = null;
    if (memPhoto) photoUrl = await uploadPhoto(memPhoto, `memory/${currentUser.uid}/${Date.now()}_${memPhoto.name}`);
    await addDoc(collection(db, 'memories'), {
      text, photoUrl, toName: toName||'친구', type: selectedMemType,
      authorId: currentUser.uid, authorName: currentUser.displayName||currentUser.email,
      createdAt: serverTimestamp()
    });
    document.getElementById('mem-text').value = '';
    document.getElementById('mem-to').value = '';
    memPhoto = null;
    document.getElementById('mem-photo-row').innerHTML = '<label for="mem-photo-input" class="photo-add">+</label>';
    document.getElementById('mem-photo-input').value = '';
    showToast('💌 메시지 남겼어!');
    loadMemory();
  } catch(e) { showToast('오류가 발생했어요'); }
  btn.textContent = '남기기'; btn.disabled = false;
};

async function loadMemory() {
  const { db, collection, getDocs, query, orderBy } = fb();
  const el = document.getElementById('memory-list');
  try {
    const snap = await getDocs(query(collection(db, 'memories'), orderBy('createdAt','desc')));
    if (snap.empty) { el.innerHTML = '<div class="empty"><div class="empty-icon">💌</div>첫 메시지를 남겨봐!</div>'; return; }
    el.innerHTML = '';
    snap.forEach(d => el.appendChild(buildMemoryCard(d.id, d.data())));
  } catch(e) { el.innerHTML = '<div class="empty">불러오기 실패</div>'; }
}

function buildMemoryCard(id, data) {
  const typeLabel = {msg:'💬 하고싶은 말',memory:'📸 추억',advice:'💡 조언',cheer:'🌟 응원'}[data.type]||data.type;
  const typeClass = ['msg','cheer'].includes(data.type)?'type-msg':'type-memory';
  const div = document.createElement('div');
  div.className = 'memory-card';
  div.innerHTML = `
    <div class="mc-header">
      <div class="av ${data.authorId===currentUser?.uid?'av-me':'av-other'}">${(data.authorName||'?')[0].toUpperCase()}</div>
      <span style="font-size:13px;font-weight:500;">${data.authorName||'?'}</span>
      <span class="mc-to" style="margin-left:auto;">→ <span>${data.toName||'친구'}</span></span>
    </div>
    ${data.photoUrl ? `<img class="mc-photo" src="${data.photoUrl}" loading="lazy">` : ''}
    ${data.text ? `<div class="mc-body">${data.text}</div>` : ''}
    <div class="mc-footer">
      <span class="mc-from">${timeAgo(data.createdAt)}</span>
      <span class="mc-type ${typeClass}">${typeLabel}</span>
    </div>`;
  return div;
}

// ── GOALS ────────────────────────────────────────
window.toggleGoalForm = () => {
  document.getElementById('goal-form').classList.toggle('open');
};

window.addGoal = async () => {
  if (!currentUser) return;
  const { db, collection, addDoc, serverTimestamp } = fb();
  const title = document.getElementById('goal-title-inp').value.trim();
  const sub = document.getElementById('goal-sub-inp').value.trim();
  if (!title) { showToast('목표 이름을 입력해주세요'); return; }
  await addDoc(collection(db, 'goals'), {
    title, authorId: currentUser.uid, authorName: currentUser.displayName||currentUser.email,
    subGoals: sub ? [{ text: sub, done: false }] : [],
    createdAt: serverTimestamp()
  });
  document.getElementById('goal-title-inp').value = '';
  document.getElementById('goal-sub-inp').value = '';
  document.getElementById('goal-form').classList.remove('open');
  showToast('🎯 목표 추가!');
  loadGoals();
};

async function loadGoals() {
  const { db, collection, getDocs, query, orderBy } = fb();
  const myEl = document.getElementById('my-goals');
  const friendEl = document.getElementById('friend-goals');
  try {
    const snap = await getDocs(query(collection(db, 'goals'), orderBy('createdAt','desc')));
    myEl.innerHTML = ''; friendEl.innerHTML = '';
    let myCount = 0, friendCount = 0;
    snap.forEach(d => {
      const data = d.data();
      const isMe = data.authorId === currentUser?.uid;
      const card = buildGoalCard(d.id, data);
      if (isMe) { myEl.appendChild(card); myCount++; }
      else { friendEl.appendChild(card); friendCount++; }
    });
    if (myCount === 0) myEl.innerHTML = '<div class="empty" style="padding:24px;">아직 목표가 없어요</div>';
    if (friendCount === 0) friendEl.innerHTML = '<div class="empty" style="padding:24px;">친구의 목표가 없어요</div>';
  } catch(e) { myEl.innerHTML = '<div class="empty">불러오기 실패</div>'; }
}

function buildGoalCard(id, data) {
  const subs = data.subGoals || [];
  const done = subs.filter(s=>s.done).length;
  const pct = subs.length > 0 ? Math.round(done/subs.length*100) : 0;
  const isMe = data.authorId === currentUser?.uid;

  const div = document.createElement('div');
  div.className = 'goal-main-card'; div.dataset.id = id;

  const subHtml = subs.map((s,i) => `
    <div class="sub-goal">
      <div class="sub-check ${s.done?'done':''}" onclick="toggleSubGoal('${id}',${i})">${s.done?'✓':''}</div>
      <span class="sub-goal-text ${s.done?'done':''}">${s.text}</span>
    </div>`).join('');

  const addSubHtml = isMe ? `
    <div class="add-sub-row">
      <input class="add-sub-inp" placeholder="작은 목표 추가...">
      <button class="add-sub-btn" onclick="addSubGoal('${id}',this)">추가</button>
    </div>` : '';

  div.innerHTML = `
    <div class="gmc-header" onclick="this.parentElement.querySelector('.sub-goals').style.display=this.parentElement.querySelector('.sub-goals').style.display==='none'?'block':'none'">
      <div class="gmc-av ${isMe?'':'av-other' }" style="${isMe?'':'background:var(--warm-l);color:var(--warm);'}">${(data.authorName||'?')[0].toUpperCase()}</div>
      <div class="gmc-info">
        <div class="gmc-title">${data.title}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="gmc-pct">${pct}%</div>
    </div>
    <div class="sub-goals">
      ${subHtml || '<div style="font-size:13px;color:var(--ink3);padding:4px 0;">작은 목표를 추가해봐 👇</div>'}
      ${addSubHtml}
    </div>`;
  return div;
}

window.addSubGoal = async (goalId, btn) => {
  const inp = btn.previousElementSibling;
  const text = inp.value.trim();
  if (!text) return;
  const { db, doc, updateDoc, arrayUnion } = fb();
  await updateDoc(doc(db, 'goals', goalId), { subGoals: arrayUnion({ text, done: false }) });
  inp.value = '';
  showToast('✅ 작은 목표 추가!');
  loadGoals();
};

window.toggleSubGoal = async (goalId, idx) => {
  const { db, doc, getDoc, updateDoc } = fb();
  const snap = await getDoc(doc(db, 'goals', goalId));
  const subs = [...(snap.data().subGoals || [])];
  subs[idx] = { ...subs[idx], done: !subs[idx].done };
  await updateDoc(doc(db, 'goals', goalId), { subGoals: subs });
  loadGoals();
};

// ── BOOKS ────────────────────────────────────────
window.postBook = async () => {
  if (!currentUser) return;
  const { db, collection, addDoc, serverTimestamp } = fb();
  const text = document.getElementById('book-review').value.trim();
  if (!text) { showToast('내용을 입력해주세요'); return; }
  await addDoc(collection(db, 'books'), {
    text, status: selectedBookStatus,
    authorId: currentUser.uid, authorName: currentUser.displayName||currentUser.email,
    createdAt: serverTimestamp()
  });
  document.getElementById('book-review').value = '';
  showToast('📚 책장에 추가!');
  loadBooks();
};

async function loadBooks() {
  const { db, collection, getDocs, query, orderBy } = fb();
  const el = document.getElementById('book-list');
  try {
    const snap = await getDocs(query(collection(db, 'books'), orderBy('createdAt','desc')));
    if (snap.empty) { el.innerHTML = '<div class="empty"><div class="empty-icon">📚</div>첫 번째 책을 기록해봐!</div>'; return; }
    el.innerHTML = '';
    snap.forEach(d => {
      const data = d.data();
      const statusLabel = {done:'완독',reading:'읽는 중',want:'읽고싶어'}[data.status]||data.status;
      const statusClass = {done:'status-done',reading:'status-reading',want:'status-want'}[data.status]||'';
      const isMe = data.authorId === currentUser?.uid;
      const div = document.createElement('div');
      div.className = 'card';
      div.style.cssText = 'display:flex;gap:10px;align-items:flex-start;';
      div.innerHTML = `
        <div class="av ${isMe?'av-me':'av-other'}" style="flex-shrink:0;">${(data.authorName||'?')[0].toUpperCase()}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-size:13px;font-weight:500;">${data.authorName||'?'}</span>
            <span class="feed-tag ${statusClass==='status-done'?'tag-daily':statusClass==='status-reading'?'tag-thought':'tag-photo'}" style="font-size:10px;padding:2px 8px;border-radius:20px;">${statusLabel}</span>
          </div>
          <div style="font-size:14px;line-height:1.7;color:var(--ink);">${data.text}</div>
          <div style="font-size:11px;color:var(--ink3);margin-top:6px;">${timeAgo(data.createdAt)}</div>
        </div>`;
      el.appendChild(div);
    });
  } catch(e) { el.innerHTML = '<div class="empty">불러오기 실패</div>'; }
}

  if (w1) document.getElementById('kw1').textContent = w1;
  const w2 = prompt('친구의 키워드:', document.getElementById('kw2').textContent);
  if (w2) document.getElementById('kw2').textContent = w2;
